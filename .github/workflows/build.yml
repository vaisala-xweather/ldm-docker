name: Build and publish image

on:
  push:
    tags:
      - 'v*.*.*-*'
  # Build and smoke-test a pull request without logging in or pushing.
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v6.15.0-1)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse version and build number
        id: parse
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # No release tag to parse: build the Dockerfile's default LDM version.
            echo "ldm_version=$(sed -n 's/^ARG LDM_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Tag '$ref' does not match expected format vX.Y.Z-N" >&2
            exit 1
          fi
          ldm_version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          image_tag="${ldm_version}-${build_number}"
          echo "ldm_version=${ldm_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ldm:test
          build-args: |
            LDM_VERSION=${{ steps.parse.outputs.ldm_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          IMAGE: ldm:test
          SKIP_BUILD: '1'
        run: ./util/test

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            LDM_VERSION=${{ steps.parse.outputs.ldm_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ldm:${{ steps.parse.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/ldm:${{ steps.parse.outputs.ldm_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.parse.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
