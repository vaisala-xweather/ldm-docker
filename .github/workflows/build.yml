name: Build and publish image

on:
  push:
    tags:
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v6.15.0-1)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version and build number
        id: parse
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Tag '$ref' does not match expected format vX.Y.Z-N" >&2
            exit 1
          fi
          ldm_version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          image_tag="${ldm_version}-${build_number}"
          echo "ldm_version=${ldm_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LDM_VERSION=${{ steps.parse.outputs.ldm_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ldm:${{ steps.parse.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/ldm:${{ steps.parse.outputs.ldm_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.parse.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
